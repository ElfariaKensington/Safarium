name: CI Tests

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS arm64 Tests
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          BEST_XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "$BEST_XCODE" && -d "$BEST_XCODE/Contents/Developer" ]]; then
            echo "Selecting Xcode: $BEST_XCODE"
            sudo xcode-select -s "$BEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version || true
          swift --version
          uname -m
          XCODE_VER="$(xcodebuild -version 2>/dev/null | tr '\n' '-' | tr -cs 'A-Za-z0-9._-' '-' | sed 's/-$//')"
          echo "version=${XCODE_VER:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Verify Reference assets & symlink portability
        run: |
          set -euo pipefail
          broken=$(find Reference scripts -type l ! -exec test -e {} \; -print)
          if [[ -n "$broken" ]]; then
            echo "Broken symlinks detected:"
            echo "$broken"
            exit 1
          fi
          test -f Reference/Components/bookmarks.json
          test -d Reference/Components/symbols
          test -d Reference/Components/wallpapers
          test -d Reference/Animations/spinner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run BrowserCore JS anti-fingerprinting runtime tests
        run: node BrowserCore/tests/antifp_runtime_test.mjs

      - name: Cache CEF framework
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: BrowserCore/third_party/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-chromium-framework.sh') }}

      - name: Build BrowserCore and run privacy tests (with standalone fallback)
        id: browsercore
        run: |
          set -euo pipefail
          HAS_BROWSERCORE=false
          if [[ "${SAFARIUM_SKIP_CEF:-0}" != "1" ]]; then
            if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
              brew install cmake ninja
            fi
            if ./scripts/build-chromium-framework.sh --mode=cef; then
              ./BrowserCore/build/BrowserCorePrivacyTests
              HAS_BROWSERCORE=true
            else
              echo "::warning::CEF download or BrowserCore CMake build failed; falling back to standalone privacy tests + MockBrowserEngine"
              rm -rf BrowserCore/build
            fi
          fi

          if [[ "$HAS_BROWSERCORE" != "true" ]]; then
            clang++ -std=c++20 -fobjc-arc -framework Foundation \
              -IBrowserCore/src \
              BrowserCore/src/SXPrivacyEngine.mm \
              BrowserCore/src/SXPrivacyEngineTests.mm \
              -o /tmp/BrowserCorePrivacyTests
            /tmp/BrowserCorePrivacyTests
          fi
          echo "has_browsercore=${HAS_BROWSERCORE}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: SafariShell/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-bc-${{ steps.browsercore.outputs.has_browsercore }}-${{ hashFiles('SafariShell/Package.swift', 'BrowserCore/include/**') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-bc-${{ steps.browsercore.outputs.has_browsercore }}-

      - name: Run SafariShell Swift tests
        working-directory: SafariShell
        run: swift test --arch arm64
